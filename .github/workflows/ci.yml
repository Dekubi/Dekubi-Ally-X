name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  asset-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No game data, binaries or archives tracked
        run: |
          bad=$(git ls-files | grep -Ei '\.(exe|dll|pdb|lib|sys|xvd|xvc|msixvc|xsp|cab|msi|bin|dat|pak|rpf|ttpf|dds|ktx2?|dxbc|dxil|cso|spv|wav|xma|ogg|opus|mp3|mp4|bik|bk2|awc|zip|7z|rar)$' || true)
          if [ -n "$bad" ]; then echo "Forbidden files tracked:"; echo "$bad"; exit 1; fi

  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
